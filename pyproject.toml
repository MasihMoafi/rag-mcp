[project]
name = "rag-mcp"
version = "0.1.0"
description = "Standalone local hybrid-RAG MCP server (BM25 + vector search + reranking)"
requires-python = ">=3.10"
dependencies = [
    "ollama",
    "pymupdf>=1.26.3",
    "torch==2.5.1",
    "sentence-transformers>=5.0.0",
    "langchain-community>=0.3.27",
    "lancedb>=0.17.0",
    "pyarrow>=14.0.0",
    "unstructured[docx,pptx,xlsx,csv]>=0.18.32",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "rapidocr-onnxruntime>=1.4.4",
    "tantivy>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag", "utils"]

[project.optional-dependencies]
openai = ["openai>=1.0"]

[dependency-groups]
dev = ["pytest>=9.0.1"]
