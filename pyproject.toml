[project]
name = "ragmcp"
version = "0.2.0"
description = "Scoped hybrid-RAG CLI and MCP server with BM25, vector retrieval, reranking, and answer synthesis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Masih Moafi" }]
keywords = ["rag", "mcp", "retrieval", "bm25", "embeddings", "lancedb", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]
# The light install: BM25 (Tantivy via LanceDB), PDF text, small ONNX embedding
# models (fastembed, CPU) and the OpenAI-compatible embeddings client. No PyTorch.
dependencies = [
    "filelock>=3.13",
    "lancedb>=0.17.0",
    "pyarrow>=14.0.0",
    "tantivy>=0.26.0",
    "pymupdf>=1.26.3",
    "requests>=2.31",
    "fastembed>=0.4",
    "openai>=1.0",
    "questionary>=2.1,<3",
]

[project.optional-dependencies]
# GPU embeddings and the cross-encoder reranker through sentence-transformers.
full = ["torch>=2.5.1", "sentence-transformers>=5.0.0", "transformers>=4.40"]
# DOCX / PPTX / XLSX / CSV parsing.
office = ["unstructured[docx,pptx,xlsx,csv]>=0.18.32"]
# Alternative vector store.
qdrant = ["qdrant-client>=1.7.0"]
# Optional ingestion-time contextual retrieval through Anthropic's Messages API.
anthropic = ["anthropic>=0.40.0"]
all = ["ragmcp[full,office,qdrant,anthropic]"]

[project.scripts]
rag = "rag.cli:main"

[project.urls]
Homepage = "https://github.com/MasihMoafi/rag-mcp"
Repository = "https://github.com/MasihMoafi/rag-mcp"
Studio = "https://rag.masihmoafi.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Local LanceDB indexes and caches live next to the code; never ship them.
exclude = ["**/__pycache__", "rag/rag_db_*", "rag/rag_db_v2", "**/*.pyc"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
only-include = ["rag", "utils", "server.py", "README.md", "LICENSE", "pyproject.toml", "hatch_build.py"]

[tool.hatch.build.targets.sdist.force-include]
"rag/studio_dist/bundle.tar.gz" = "rag/studio_dist/bundle.tar.gz"

[tool.hatch.build.targets.wheel]
packages = ["rag", "utils"]

[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"rag/studio_dist/bundle.tar.gz" = "rag/studio_dist/bundle.tar.gz"

[dependency-groups]
dev = ["pytest>=9.0.1"]
