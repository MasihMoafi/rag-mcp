<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">Retrieval reliability across five recorded corpora (qwen3-embedding:0.6b + cross-encoder)</title>
<desc id="desc">Query-level grades from rag-mcp evaluation result files with 0.6b embeddings and cross-encoder reranker. Brain and Behavior: 76.7 percent strict Hit@1, 93.3 percent Hit@5. Attention paper: 56.7 percent strict Hit@1, 90.0 percent Hit@5. Mixed codebase: 75.8 percent strict Hit@1, 87.9 percent Hit@5. Fire and Blood: 40.0 percent strict Hit@1, 70.0 percent Hit@5. Napoleon: 46.7 percent strict Hit@1, 66.7 percent Hit@5.</desc>
<rect width="1100" height="560" fill="#0b0f14"/>
<text x="44" y="44" fill="#f5f7fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">Retrieval reliability (0.6B + Reranker)</text>
<text x="44" y="72" fill="#9aa4b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">exact full answer vs. full + partial · qwen3-embedding:0.6b + cross-encoder · five recorded corpora</text>

