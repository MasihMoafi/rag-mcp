</g>

<line x1="40" y1="404" x2="900" y2="404" stroke="#232b35"/>
<text x="40" y="424" fill="#748091" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">No settings changed between rows — same chunk size, same top_k, same reranker for all five. Code and the short,</text>
<text x="40" y="440" fill="#748091" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">structured paper concentrate each fact in one place; long narrative prose spreads interpretive answers across</text>
<text x="40" y="456" fill="#748091" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">passages, which hurts chunk-based retrieval regardless of tuning. See results.csv for the per-question detail.</text>
</svg>
