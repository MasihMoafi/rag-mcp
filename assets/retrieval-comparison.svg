<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-labelledby="title desc">
<title id="title">Retrieval accuracy across five real corpora</title>
<desc id="desc">Real runs of the current live rag-mcp server, hybrid BM25 plus vector search plus reranking, one query per question, graded fully retrieved, partial, or missing. Four single-document corpora: Attention paper 86.7 percent full, Brain and Behavior 76.7 percent, Napoleon 48.3 percent, Fire and Blood 46.7 percent. One mixed 36-file directory (Rust, Python, and a Jupyter notebook together) searched as a whole directory: 90.9 percent full, 0 missing.</desc>
<rect width="940" height="470" fill="#0b0f14"/>
<text x="40" y="42" fill="#f5f7fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">Retrieval accuracy — five real corpora, one live server</text>
<text x="40" y="68" fill="#9aa4b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">hybrid BM25 + vector + reranking · source: rag-mcp/evals/*/results.csv</text>

<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
  <rect x="560" y="80" width="14" height="14" rx="3" fill="#22d3ee"/>
  <text x="580" y="91" fill="#c8d0da">fully retrieved</text>
  <rect x="710" y="80" width="14" height="14" rx="3" fill="#7b8491"/>
  <text x="730" y="91" fill="#c8d0da">partial</text>
  <rect x="810" y="80" width="14" height="14" rx="3" fill="#ef4444"/>
  <text x="830" y="91" fill="#c8d0da">missing</text>
</g>

<text x="40" y="108" fill="#748091" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1">SINGLE DOCUMENT — same protocol, directly comparable</text>

<line x1="60" y1="118" x2="60" y2="308" stroke="#232b35"/>
<line x1="440" y1="118" x2="440" y2="308" stroke="#232b35"/>
<line x1="820" y1="118" x2="820" y2="308" stroke="#232b35"/>

<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <text x="60" y="120" fill="#c8d0da">Attention (paper)</text>
  <text x="900" y="120" fill="#f5f7fa" text-anchor="end" font-weight="700">26/30 · 86.7%</text>
  <rect x="60.0" y="126" width="606.7" height="24" rx="4" fill="#22d3ee"/>
  <rect x="668.7" y="126" width="70.0" height="24" rx="4" fill="#7b8491"/>
  <rect x="740.7" y="126" width="23.3" height="24" rx="4" fill="#ef4444"/>

  <text x="60" y="174" fill="#c8d0da">Brain &amp; Behavior (book)</text>
  <text x="900" y="174" fill="#f5f7fa" text-anchor="end" font-weight="700">23/30 · 76.7%</text>
  <rect x="60.0" y="180" width="536.7" height="24" rx="4" fill="#22d3ee"/>
  <rect x="598.7" y="180" width="116.7" height="24" rx="4" fill="#7b8491"/>
  <rect x="717.3" y="180" width="46.7" height="24" rx="4" fill="#ef4444"/>

  <text x="60" y="228" fill="#c8d0da">Napoleon (book)</text>
  <text x="900" y="228" fill="#f5f7fa" text-anchor="end" font-weight="700">14/29 · 48.3%</text>
  <rect x="60.0" y="234" width="337.9" height="24" rx="4" fill="#22d3ee"/>
  <rect x="399.9" y="234" width="265.5" height="24" rx="4" fill="#7b8491"/>
  <rect x="667.4" y="234" width="96.6" height="24" rx="4" fill="#ef4444"/>

  <text x="60" y="282" fill="#c8d0da">Fire &amp; Blood (novel)</text>
  <text x="900" y="282" fill="#f5f7fa" text-anchor="end" font-weight="700">14/30 · 46.7%</text>
  <rect x="60.0" y="288" width="326.7" height="24" rx="4" fill="#22d3ee"/>
  <rect x="388.7" y="288" width="233.3" height="24" rx="4" fill="#7b8491"/>
  <rect x="624.0" y="288" width="140.0" height="24" rx="4" fill="#ef4444"/>
</g>

<line x1="40" y1="324" x2="900" y2="324" stroke="#232b35"/>
<text x="40" y="346" fill="#748091" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1">MIXED DIRECTORY — different shape of test, not comparable to the corpora above</text>

<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <text x="60" y="374" fill="#c8d0da">Rust + Python + notebook, one 36-file directory, whole-dir scoped</text>
  <text x="900" y="374" fill="#f5f7fa" text-anchor="end" font-weight="700">30/33 · 90.9%</text>
  <rect x="60.0" y="380" width="636.4" height="24" rx="4" fill="#22d3ee"/>
