<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Multi-Domain Retrieval Benchmark Results</title>
  <desc id="desc">Precision (Hit@1), Recall (Hit@5), and MRR across 5 heterogeneous evaluation corpora.</desc>
  
  <!-- Background Card -->
  <rect width="940" height="420" rx="12" fill="#090d14"/>
  <rect x="0.5" y="0.5" width="939" height="419" rx="11.5" stroke="#1e293b" stroke-width="1"/>

  <!-- Title & Legend -->
  <text x="36" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">RETRIEVAL ACCURACY &amp; RECALL BREAKDOWN</text>
  <text x="36" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">LLM Judge Verified across 153 Domain Queries · LanceDB + Tantivy BM25 + Cross-Encoder</text>

  <!-- Legend -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">
    <rect x="640" y="32" width="10" height="10" rx="2" fill="#38bdf8"/>
    <text x="656" y="41" fill="#cbd5e1">Hit@1 (Top-1 Precision)</text>
    
    <rect x="800" y="32" width="10" height="10" rx="2" fill="#a78bfa"/>
    <text x="816" y="41" fill="#cbd5e1">Hit@5 (Full Recall)</text>
  </g>

  <!-- Domain 1: Brain & Behavior -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" transform="translate(36, 85)">
    <text x="0" y="14" fill="#e2e8f0" font-size="13" font-weight="600">Brain &amp; Behavior (Neuroscience Textbook · 3,324 chunks)</text>
    <rect x="680" y="0" width="70" height="18" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="715" y="13" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">MRR 0.831</text>
    <text x="868" y="14" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="end">93.3%</text>
    
    <!-- Background Track -->
    <rect x="0" y="24" width="868" height="18" rx="5" fill="#1e293b"/>
    <!-- Hit@5 Bar -->
    <rect x="0" y="24" width="809.8" height="18" rx="5" fill="#a78bfa" fill-opacity="0.4"/>
    <!-- Hit@1 Bar -->
    <rect x="0" y="24" width="665.7" height="18" rx="5" fill="#38bdf8"/>
  </g>

  <!-- Domain 2: Attention Is All You Need -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" transform="translate(36, 145)">
    <text x="0" y="14" fill="#e2e8f0" font-size="13" font-weight="600">Attention Is All You Need (AI / Scientific Paper · 47 chunks)</text>
    <rect x="680" y="0" width="70" height="18" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="715" y="13" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">MRR 0.703</text>
    <text x="868" y="14" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="end">90.0%</text>
    
    <rect x="0" y="24" width="868" height="18" rx="5" fill="#1e293b"/>
    <rect x="0" y="24" width="781.2" height="18" rx="5" fill="#a78bfa" fill-opacity="0.4"/>
    <rect x="0" y="24" width="492.1" height="18" rx="5" fill="#38bdf8"/>
  </g>

  <!-- Domain 3: Mixed Codebase -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" transform="translate(36, 205)">
    <text x="0" y="14" fill="#e2e8f0" font-size="13" font-weight="600">Mixed Codebase (Python + Rust + Notebook · 515 chunks)</text>
    <rect x="680" y="0" width="70" height="18" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="715" y="13" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">MRR 0.812</text>
    <text x="868" y="14" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="end">87.9%</text>
    
    <rect x="0" y="24" width="868" height="18" rx="5" fill="#1e293b"/>
    <rect x="0" y="24" width="762.9" height="18" rx="5" fill="#a78bfa" fill-opacity="0.4"/>
    <rect x="0" y="24" width="657.9" height="18" rx="5" fill="#38bdf8"/>
  </g>

  <!-- Domain 4: Fire & Blood -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" transform="translate(36, 265)">
    <text x="0" y="14" fill="#e2e8f0" font-size="13" font-weight="600">Fire &amp; Blood (George R.R. Martin Fantasy Novel · 1,700 chunks)</text>
    <rect x="680" y="0" width="70" height="18" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="715" y="13" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">MRR 0.526</text>
    <text x="868" y="14" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="end">70.0%</text>
    
    <rect x="0" y="24" width="868" height="18" rx="5" fill="#1e293b"/>
    <rect x="0" y="24" width="607.6" height="18" rx="5" fill="#a78bfa" fill-opacity="0.4"/>
    <rect x="0" y="24" width="347.2" height="18" rx="5" fill="#38bdf8"/>
  </g>

  <!-- Domain 5: Napoleon Biography -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" transform="translate(36, 325)">
    <text x="0" y="14" fill="#e2e8f0" font-size="13" font-weight="600">Napoleon (Historical Biography · 728 chunks)</text>
    <rect x="680" y="0" width="70" height="18" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="715" y="13" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">MRR 0.548</text>
    <text x="868" y="14" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="end">66.7%</text>
    
    <rect x="0" y="24" width="868" height="18" rx="5" fill="#1e293b"/>
    <rect x="0" y="24" width="578.9" height="18" rx="5" fill="#a78bfa" fill-opacity="0.4"/>
    <rect x="0" y="24" width="405.3" height="18" rx="5" fill="#38bdf8"/>
  </g>
</svg>
