<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480" role="img" aria-labelledby="title desc">
<title id="title">Retrieval accuracy across five real corpora, ranked by success</title>
<desc id="desc">Real runs of the current live rag-mcp server, hybrid BM25 plus vector search plus reranking, one query per question, graded fully retrieved, partial, or missing. A mixed 36-file directory of Rust, Python, and a notebook: 90.9 percent full, 100 percent at least partial. Attention paper: 86.7 percent full, 96.7 percent at least partial. Brain and Behavior: 76.7 percent full, 93.3 percent at least partial. Napoleon: 48.3 percent full, 86.2 percent at least partial. Fire and Blood: 46.7 percent full, 80 percent at least partial.</desc>
<rect width="940" height="480" fill="#0b0f14"/>
<text x="40" y="42" fill="#f5f7fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">Retrieval accuracy — five real corpora, one live server</text>
<text x="40" y="68" fill="#9aa4b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">hybrid BM25 + vector + reranking · source: rag-mcp/evals/*/results.csv</text>

<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
  <rect x="560" y="80" width="14" height="14" rx="3" fill="#22d3ee"/>
  <text x="580" y="91" fill="#c8d0da">fully retrieved</text>
  <rect x="710" y="80" width="14" height="14" rx="3" fill="#7b8491"/>
  <text x="730" y="91" fill="#c8d0da">partial</text>
  <rect x="810" y="80" width="14" height="14" rx="3" fill="#ef4444"/>
  <text x="830" y="91" fill="#c8d0da">missing</text>
</g>

<text x="40" y="108" fill="#748091" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1">MIXED DIRECTORY — code + docs, directory-scoped (different shape of test)</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <text x="60" y="128" fill="#c8d0da">Rust + Python + notebook, one 36-file directory</text>
  <text x="900" y="128" fill="#f5f7fa" text-anchor="end" font-weight="700">30/33 full · 100% not missing</text>
  <rect x="60.0" y="134" width="636.4" height="24" rx="4" fill="#22d3ee"/>
  <rect x="698.4" y="134" width="63.6" height="24" rx="4" fill="#7b8491"/>
</g>

<line x1="40" y1="172" x2="900" y2="172" stroke="#232b35"/>
<text x="40" y="194" fill="#748091" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1">SINGLE DOCUMENT — same protocol, directly comparable to each other</text>

<line x1="60" y1="204" x2="60" y2="394" stroke="#232b35"/>
<line x1="440" y1="204" x2="440" y2="394" stroke="#232b35"/>
<line x1="820" y1="204" x2="820" y2="394" stroke="#232b35"/>

<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <text x="60" y="206" fill="#c8d0da">Attention (paper)</text>
  <text x="900" y="206" fill="#f5f7fa" text-anchor="end" font-weight="700">26/30 full · 96.7% not missing</text>
  <rect x="60.0" y="212" width="606.7" height="24" rx="4" fill="#22d3ee"/>
  <rect x="668.7" y="212" width="70.0" height="24" rx="4" fill="#7b8491"/>
  <rect x="740.7" y="212" width="23.3" height="24" rx="4" fill="#ef4444"/>

  <text x="60" y="260" fill="#c8d0da">Brain &amp; Behavior (book)</text>
  <text x="900" y="260" fill="#f5f7fa" text-anchor="end" font-weight="700">23/30 full · 93.3% not missing</text>
  <rect x="60.0" y="266" width="536.7" height="24" rx="4" fill="#22d3ee"/>
  <rect x="598.7" y="266" width="116.7" height="24" rx="4" fill="#7b8491"/>
  <rect x="717.3" y="266" width="46.7" height="24" rx="4" fill="#ef4444"/>

  <text x="60" y="314" fill="#c8d0da">Napoleon (book)</text>
  <text x="900" y="314" fill="#f5f7fa" text-anchor="end" font-weight="700">14/29 full · 86.2% not missing</text>
  <rect x="60.0" y="320" width="337.9" height="24" rx="4" fill="#22d3ee"/>
  <rect x="399.9" y="320" width="265.5" height="24" rx="4" fill="#7b8491"/>
  <rect x="667.4" y="320" width="96.6" height="24" rx="4" fill="#ef4444"/>

  <text x="60" y="368" fill="#c8d0da">Fire &amp; Blood (novel)</text>
  <text x="900" y="368" fill="#f5f7fa" text-anchor="end" font-weight="700">14/30 full · 80.0% not missing</text>
  <rect x="60.0" y="374" width="326.7" height="24" rx="4" fill="#22d3ee"/>
