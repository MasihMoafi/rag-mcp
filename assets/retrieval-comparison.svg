</g>

<text x="40" y="420" fill="#748091" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Single-document rows use whole-book/paper scope. The mixed row is one real directory (29 .rs, 6 .py, 1 .ipynb)</text>
<text x="40" y="438" fill="#748091" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">searched as a whole, the tool finding the right file itself. Napoleon and Fire &amp; Blood score lower — see results.csv.</text>
</svg>
