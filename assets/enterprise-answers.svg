<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-label="EnterpriseRAG-Bench: correct answers"><title>EnterpriseRAG-Bench: correct answers</title><style>.ax{fill:#9a9188;font-size:11px;font-family:ui-sans-serif,system-ui,sans-serif}.lab{fill:#efeae2;font-size:12.5px;font-family:ui-sans-serif,system-ui,sans-serif}.val{fill:#9a9188;font-size:12px;font-family:ui-sans-serif,system-ui,sans-serif}.grid{stroke:#2c2924;stroke-width:1}</style><rect width="860" height="350" fill="#100f0e"/><text x="30" y="34" fill="#efeae2" font-family="ui-serif,Georgia,serif" font-size="22" font-weight="600">EnterpriseRAG-Bench: correct answers</text><text x="30" y="56" class="val">Qwen3 embedding 0.6B and reranker 4B; answers by GPT-6.1 Sol, graded with the benchmark&#x27;s own judge prompt.</text><line x1="300.0" y1="110" x2="300.0" y2="274" class="grid"/><text x="300.0" y="290" class="ax" text-anchor="middle">0%</text><line x1="425.0" y1="110" x2="425.0" y2="274" class="grid"/><text x="425.0" y="290" class="ax" text-anchor="middle">25%</text><line x1="550.0" y1="110" x2="550.0" y2="274" class="grid"/><text x="550.0" y="290" class="ax" text-anchor="middle">50%</text><line x1="675.0" y1="110" x2="675.0" y2="274" class="grid"/><text x="675.0" y="290" class="ax" text-anchor="middle">75%</text><line x1="800.0" y1="110" x2="800.0" y2="274" class="grid"/><text x="800.0" y="290" class="ax" text-anchor="middle">100%</text><text x="288" y="133.5" class="lab" text-anchor="end">A · rag 0.2</text><rect x="300" y="118" width="331.5" height="22" rx="3" fill="#6f675d"><title>A: 66.3% correct</title></rect><text x="623.5" text-anchor="end" y="133.5" class="lab">66.3%</text><text x="288" y="171.5" class="lab" text-anchor="end">B · + titles, stemming, balanced shortlist</text><rect x="300" y="156" width="376.0" height="22" rx="3" fill="#1fa396"><title>B: 75.2% correct</title></rect><text x="684.0" y="171.5" class="lab">75.2%</text><text x="288" y="209.5" class="lab" text-anchor="end">C · + short documents read whole</text><rect x="300" y="194" width="405.0" height="22" rx="3" fill="#1fa396"><title>C: 81.0% correct</title></rect><text x="713.0" y="209.5" class="lab">81.0%</text><text x="288" y="247.5" class="lab" text-anchor="end">D · C + lenient refusal rule</text><rect x="300" y="232" width="393.0" height="22" rx="3" fill="#6f675d"><title>D: 78.6% correct</title></rect><text x="701.0" y="247.5" class="lab">78.6%</text><line x1="644.0" y1="104" x2="644.0" y2="274" stroke="#efeae2" stroke-width="1.5" stroke-dasharray="4 4"/><text x="644.0" y="100" class="val" text-anchor="middle">Dataset paper's best: 68.8%</text><text x="30" y="318" class="ax">499 questions, 100,721 documents. Each step adds to the one above; B and C each beat the step before (paired test, p &lt; 0.001).</text><text x="30" y="336" class="ax">The paper&#x27;s best is BM25 over all 511,962 documents with GPT-5.4; a larger corpus is harder, so it is a reference, not a like-for-like score.</text><rect x="30" y="76" width="11" height="11" rx="3" fill="#1fa396"/><text x="46" y="86" class="val">in rag 0.3</text><rect x="140" y="76" width="11" height="11" rx="3" fill="#6f675d"/><text x="156" y="86" class="val">before, or rejected</text></svg>
