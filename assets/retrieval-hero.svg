<svg xmlns="http://www.w3.org/2000/svg" width="940" height="210" viewBox="0 0 940 210" role="img" aria-labelledby="title desc">
<title id="title">Retrieval reliability — the two best of six recorded corpora</title>
<desc id="desc">Recorded runs of the live rag-mcp server. A mixed 36-file code and docs directory: 90.9 percent fully retrieved, 100 percent at least partial. The Attention paper: 86.7 percent fully retrieved, 96.7 percent at least partial. Full six-corpus results are further down in the readme.</desc>
<rect width="940" height="210" fill="#0b0f14"/>
<text x="40" y="34" fill="#f5f7fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">Retrieval reliability</text>
<text x="40" y="54" fill="#9aa4b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">two best of six recorded corpora · full results below</text>

<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
  <rect x="600" y="26" width="12" height="12" rx="3" fill="#22d3ee"/>
  <text x="617" y="36" fill="#c8d0da">full</text>
  <rect x="670" y="26" width="12" height="12" rx="3" fill="#a78bfa"/>
  <text x="687" y="36" fill="#c8d0da">partial</text>
  <rect x="760" y="26" width="12" height="12" rx="3" fill="#ef4444"/>
  <text x="777" y="36" fill="#c8d0da">missing</text>
</g>

<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
  <text x="60" y="92" fill="#e8ecf1" font-weight="700">Rust + Python + notebook (36-file directory)</text>
  <text x="900" y="92" fill="#f5f7fa" text-anchor="end" font-weight="700">90.9% full</text>
  <rect x="60.0" y="98" width="636.4" height="28" rx="4" fill="#22d3ee"/>
  <rect x="698.4" y="98" width="63.6" height="28" rx="4" fill="#a78bfa"/>

  <text x="60" y="160" fill="#e8ecf1" font-weight="700">Attention (paper)</text>
  <text x="900" y="160" fill="#f5f7fa" text-anchor="end" font-weight="700">86.7% full</text>
  <rect x="60.0" y="166" width="606.7" height="28" rx="4" fill="#22d3ee"/>
  <rect x="668.7" y="166" width="70.0" height="28" rx="4" fill="#a78bfa"/>
  <rect x="740.7" y="166" width="23.3" height="28" rx="4" fill="#ef4444"/>
</g>
</svg>
