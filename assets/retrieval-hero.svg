<svg xmlns="http://www.w3.org/2000/svg" width="940" height="240" viewBox="0 0 940 240" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">rag-mcp Multi-Domain Unified Scaling Performance</title>
  <desc id="desc">Zero recall degradation across 6,314 chunks in a unified multi-domain index on NVIDIA GPU.</desc>
  
  <!-- Background Card with Subtle Border -->
  <rect width="940" height="240" rx="12" fill="#090d14"/>
  <rect x="0.5" y="0.5" width="939" height="239" rx="11.5" stroke="#1e293b" stroke-width="1"/>

  <!-- Header Section -->
  <text x="36" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="-0.02em">MULTI-DOMAIN SCALING BENCHMARK</text>
  <text x="36" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">153 Ground-Truth Queries · 5 Heterogeneous Corpora · 6,314 Chunks · CUDA GPU</text>

  <!-- Status Badges (Top Right) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">
    <!-- Latency Badge -->
    <rect x="660" y="24" width="115" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="673" cy="36" r="4" fill="#38bdf8"/>
    <text x="684" y="40" fill="#e2e8f0">368ms / query</text>

    <!-- Recall Badge -->
    <rect x="785" y="24" width="120" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="798" cy="36" r="4" fill="#10b981"/>
    <text x="809" y="40" fill="#10b981">0.0% Recall Loss</text>
  </g>

  <!-- Metric 1: Unified Scaled Hit@5 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="36" y="102" fill="#e2e8f0" font-size="13" font-weight="600">Unified 6,314-Chunk Index (Merged Multi-Domain)</text>
    <text x="904" y="102" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="end">81.7% Hit@5 (125/153)</text>
    <!-- Background Track -->
    <rect x="36" y="112" width="868" height="22" rx="6" fill="#1e293b"/>
    <!-- Progress Fill -->
    <rect x="36" y="112" width="709.1" height="22" rx="6" fill="url(#cyan-grad)"/>
  </g>

  <!-- Metric 2: Isolated Baseline Hit@5 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="36" y="168" fill="#e2e8f0" font-size="13" font-weight="600">Isolated Single-Domain Baselines (Average ~1.2k Chunks)</text>
    <text x="904" y="168" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="end">81.7% Hit@5 (125/153)</text>
    <!-- Background Track -->
    <rect x="36" y="178" width="868" height="22" rx="6" fill="#1e293b"/>
    <!-- Progress Fill -->
    <rect x="36" y="178" width="709.1" height="22" rx="6" fill="url(#purple-grad)"/>
  </g>

  <!-- Footer Insight Pill -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">
    <text x="36" y="222">⚡ 99.3% Top-1 candidate equivalence · 98.4% domain isolation purity · 2-stage LanceDB + Tantivy RRF + Cross-Encoder</text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
</svg>
